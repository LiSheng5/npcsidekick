[project]
name = "npcsidekick"
version = "3.1.0"
description = "NPCSidekick — AI 游戏角色框架（游戏 NPC 大脑：对话 + 记忆 + 自主日常 + 规则优先）"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "openai>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "edge-tts>=6.1",
    "structlog>=24.0",
    "rich>=13.0",
    "httpx>=0.28",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# 语义向量记忆 — 可选：未安装时自动降级（关键词匹配 / 粗估 token），
# 见 agent/memory/vector_store.py:18 与 agent/memory/token_counter.py:10。
# 需要完整向量检索：pip install ".[memory]"
memory = [
    "chromadb>=0.5",
    "tiktoken>=0.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["agent*", "npc*"]

[project.scripts]
npcsidekick = "main:main"
npc-server = "npc.server:main"
