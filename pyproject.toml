[project]
name = "npcsidekick"
version = "3.1.0"
description = "NPCSidekick — AI 游戏角色框架（游戏 NPC 大脑：对话 + 记忆 + 自主日常 + 规则优先）"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "openai>=1.0",
    "tiktoken>=0.5",
    "chromadb>=0.5",
    "structlog>=24.0",
    "rich>=13.0",
    "httpx>=0.28",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["agent*", "npc*"]

[project.scripts]
npcsidekick = "main:main"
npc-server = "npc.server:main"
