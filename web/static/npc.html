<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPC关系网</title>
<style>
  :root{
    --purple:#6c5ce7; --purple-deep:#5847d9; --purple-dark:#2a1a6e;
    --lav:#f6f3fd; --lav-border:#e5dff6;
    --text:#1f1a2e; --dim:#8d87a3;
    --green:#27ae60; --red:#e74c3c; --orange:#f39c12;
    --card:#ffffff;
    --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:var(--font); color:var(--text); min-height:100vh;
    background:
      radial-gradient(1100px 480px at 50% -6%, rgba(108,92,231,0.10), transparent 65%),
      radial-gradient(800px 420px at 8% 12%, rgba(108,92,231,0.05), transparent 60%),
      linear-gradient(180deg,#ffffff,#fbfaff);
    display:flex; flex-direction:column; align-items:center;
  }
  /* 关系网粒子背景（自 index.html Canvas 动画改造: 浅紫系近邻连线） */
  #bg-canvas{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  .navbar,.hero,.console{ position:relative; z-index:1; }

  /* ── 顶部导航：只留品牌 + 关于 ── */
  .navbar{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    padding:18px 40px;
  }
  .brand{display:flex; align-items:center; gap:10px; font-size:17px; font-weight:800; letter-spacing:.5px; color:var(--purple-dark);}
  .brand .logo{
    width:26px; height:26px; border-radius:8px;
    background:linear-gradient(135deg,#8f7bff,#5c4bd8);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; font-weight:800;
    box-shadow:0 4px 14px rgba(108,92,231,0.35);
  }
  .nav-right{display:flex; align-items:center; gap:26px;}
  .nav-right a{color:var(--dim); text-decoration:none; font-size:14px;}
  .nav-right a:hover{color:var(--purple-deep);}

  /* ── Hero：标题与说明同字号（用户要求） ── */
  .hero{ text-align:center; padding:34px 24px 26px; }
  .hero h1{ font-size:15px; font-weight:800; letter-spacing:.02em; color:var(--purple-dark); }
  .hero h1 span{
    background:linear-gradient(120deg,#9b4dff,#4b3fd4);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .hero p{ margin-top:10px; font-size:15px; color:var(--dim); line-height:1.8; }

  /* ── K 控制台大屏（放大版） ── */
  .console{
    width:min(1440px, 96vw); margin:6px auto 60px;
    background:var(--card); border:1px solid var(--lav-border); border-radius:22px;
    box-shadow:0 24px 70px rgba(84,60,180,0.12);
    overflow:hidden;
  }
  .console-inner{ display:grid; grid-template-columns:210px 1fr 400px; min-height:640px; }

  /* 左侧：只要一个概览 */
  .sidebar{ background:#faf8ff; border-right:1px solid var(--lav-border); padding:18px 12px; display:flex; flex-direction:column; gap:8px; }
  .side-item{
    display:flex; align-items:center; gap:11px; padding:12px 14px; border-radius:12px;
    font-size:14px; color:var(--dim); cursor:pointer;
  }
  .side-item .ic{ width:20px; height:20px; display:flex; align-items:center; justify-content:center; color:currentColor; }
  .side-item.active{ background:linear-gradient(120deg,rgba(108,92,231,0.13),rgba(108,92,231,0.06)); color:var(--purple-deep); font-weight:700; }
  .side-item.active .ic{ color:var(--purple-deep); }

  /* 中栏：工具条 + 关系网画布 */
  .stage{ display:flex; flex-direction:column; min-width:0; background:#fbfaff; }
  .toolbar{ display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--lav-border); background:#fff; }
  .search{
    flex:0 1 300px; display:flex; align-items:center; gap:8px;
    background:#f4f1fb; border:1px solid var(--lav-border); border-radius:10px;
    padding:9px 13px; font-size:13px; color:var(--dim); cursor:text;
  }
  .toolbar .spacer{flex:1;}
  .btn-filter{ background:#fff; border:1px solid var(--lav-border); color:var(--dim); border-radius:10px; padding:9px 16px; font-size:13px; font-family:var(--font); cursor:pointer; }
  .btn-new{
    background:linear-gradient(120deg,#7a63f2,#5847d9); color:#fff; border:none; border-radius:10px;
    padding:9px 18px; font-size:13px; font-weight:700; font-family:var(--font); cursor:pointer;
    box-shadow:0 6px 16px rgba(108,92,231,0.28);
  }
  /* 画布：关系网 */
  .canvas{ position:relative; flex:1; min-height:560px; }
  .canvas svg{ position:absolute; inset:0; width:100%; height:100%; }
  .node{
    position:absolute; width:186px; background:#fff; border:1px solid var(--lav-border);
    border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:11px;
    box-shadow:0 8px 24px rgba(30,20,80,0.08);
    cursor:pointer; transition:border-color .2s, box-shadow .2s, transform .2s;
  }
  .node:hover{ border-color:rgba(108,92,231,0.45); transform:translateY(-2px); }
  .node.selected{
    border-color:var(--purple);
    box-shadow:0 12px 32px rgba(108,92,231,0.28), 0 0 0 3px rgba(108,92,231,0.12);
  }
  .node .avatar{
    width:44px; height:44px; border-radius:50%; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:17px; font-weight:700;
  }
  .node .nm{ font-size:15px; font-weight:800; color:var(--purple-dark); }
  .node .rl{ font-size:12px; color:var(--dim); margin-top:2px; }
  .edge-label{
    position:absolute; transform:translate(-50%,-50%);
    background:#fff; border:1px solid var(--lav-border); border-radius:99px;
    padding:3px 10px; font-size:12px; font-weight:700; white-space:nowrap;
    box-shadow:0 3px 10px rgba(30,20,80,0.10);
  }
  .edge-label.green{ color:#1e8f4e; border-color:rgba(39,174,96,0.35); }
  .edge-label.red{ color:#c0392b; border-color:rgba(231,76,60,0.35); }
  .edge-label.orange{ color:#c87f0a; border-color:rgba(243,156,18,0.4); }

  /* 右侧：NPC 详情面板（区块数据驱动 — JSON 里有的字段才渲染区块） */
  .panel{ border-left:1px solid var(--lav-border); background:#fff; padding:18px; display:flex; flex-direction:column; gap:16px; }
  .panel-head{ display:flex; gap:12px; align-items:center; }
  .panel-head .avatar{
    width:52px; height:52px; border-radius:50%; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; font-weight:700;
  }
  .panel-head .nm{ font-size:18px; font-weight:800; color:var(--purple-dark); }
  .panel-head .tags{ display:flex; gap:6px; margin-top:4px; flex-wrap:wrap; }
  .tag{ background:rgba(108,92,231,0.08); color:var(--purple-deep); border-radius:8px; padding:2px 8px; font-size:11px; }
  .tabs{ display:flex; gap:16px; border-bottom:1px solid var(--lav-border); padding-bottom:8px; font-size:13px; color:var(--dim); }
  .tabs span{ cursor:pointer; padding-bottom:8px; margin-bottom:-9px; }
  .tabs span.active{ color:var(--purple-deep); font-weight:800; border-bottom:2px solid var(--purple-deep); }
  .sec-title{ font-size:13px; font-weight:700; color:var(--purple-dark); margin-bottom:8px; }
  .status-box{ background:#faf8ff; border:1px solid var(--lav-border); border-radius:12px; padding:11px 13px; font-size:13px; display:flex; flex-direction:column; gap:7px; }
  .status-box .row{ display:flex; align-items:center; gap:8px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 6px var(--green); }
  .trait{ margin-bottom:11px; }
  .trait .tl{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px; color:var(--text); }
  .trait .tl b{ color:var(--purple-deep); }
  .bar{ height:7px; background:rgba(108,92,231,0.10); border-radius:99px; overflow:hidden; }
  .bar i{ display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#8f7bff,#5847d9); }
  .trait p{ font-size:12.5px; color:var(--dim); line-height:1.7; margin-top:3px; }
  .rel-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--lav-border); font-size:13px; }
  .rel-row:last-child{ border-bottom:none; }
  .rel-row .avatar{ width:30px; height:30px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:700; }
  .rel-row .nm{ color:var(--text); font-weight:600; }
  .rel-row .sc{ margin-left:auto; font-weight:800; }
  .sc.green{ color:#1e8f4e; } .sc.orange{ color:#c87f0a; } .sc.red{ color:#c0392b; }
  .detail-empty{ font-size:12.5px; color:var(--dim); padding:6px 0; }

  /* ── 新建 NPC 模态框 ── */
  .overlay{
    position:fixed; inset:0; z-index:50; background:rgba(42,26,110,0.35);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .18s;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .dialog{
    width:min(560px, 94vw); max-height:86vh; overflow-y:auto;
    background:#fff; border-radius:18px; padding:24px 26px;
    box-shadow:0 30px 80px rgba(30,20,80,0.35);
    transform:translateY(10px); transition:transform .18s;
  }
  .overlay.show .dialog{ transform:none; }
  .dialog h3{ font-size:16px; font-weight:800; color:var(--purple-dark); margin-bottom:16px; }
  .dialog .field{ margin-bottom:13px; }
  .dialog label{ display:block; font-size:12.5px; font-weight:700; color:var(--dim); margin-bottom:5px; }
  .dialog label b{ color:var(--purple-deep); }
  .dialog input, .dialog textarea{
    width:100%; border:1px solid var(--lav-border); border-radius:10px;
    padding:9px 12px; font-size:13px; font-family:var(--font); color:var(--text);
    background:#fbfaff; resize:vertical;
  }
  .dialog input:focus, .dialog textarea:focus{ outline:none; border-color:var(--purple); background:#fff; }
  .dialog textarea{ min-height:56px; font-size:12.5px; }
  .dialog .advanced summary{
    cursor:pointer; font-size:12.5px; font-weight:700; color:var(--purple-deep);
    margin-bottom:8px; user-select:none;
  }
  .dialog .hint{ font-size:11.5px; color:var(--dim); margin-top:4px; }
  .dialog .err{ display:none; font-size:12.5px; color:var(--red); background:rgba(231,76,60,0.07);
    border:1px solid rgba(231,76,60,0.25); border-radius:10px; padding:9px 12px; margin-bottom:12px; }
  .dialog .err.show{ display:block; }
  .dialog .btns{ display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
  .dialog .btns button{
    border:none; border-radius:10px; padding:10px 20px; font-size:13px; font-weight:700;
    font-family:var(--font); cursor:pointer;
  }
  .btn-cancel{ background:#f4f1fb; color:var(--dim); }
  .btn-ok{ background:linear-gradient(120deg,#7a63f2,#5847d9); color:#fff; box-shadow:0 6px 16px rgba(108,92,231,0.28); }

  /* ── 响应式 ── */
  @media (max-width:1200px){
    .console-inner{ grid-template-columns:170px 1fr 330px; }
  }
  @media (max-width:980px){
    .console-inner{ grid-template-columns:1fr; }
    .sidebar{ display:none; }
    .panel{ border-left:none; border-top:1px solid var(--lav-border); }
  }
</style>
</head>

<!-- ── 关系网粒子背景（改编自 web/static/index.html 的 Canvas 动画） ── -->
<script>
(function(){
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const COLORS = ['rgba(108,92,231,', 'rgba(155,122,244,', 'rgba(88,71,217,', 'rgba(178,160,255,'];
  const N = 90;
  const parts = [];
  for (let i = 0; i < N; i++) {
    parts.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.22,
      vy: (Math.random() - 0.5) * 0.22,
      r: 0.6 + Math.random() * 1.9,
      a: 0.12 + Math.random() * 0.30,
      c: COLORS[Math.floor(Math.random() * COLORS.length)],
    });
  }
  const MAX_LINK = 155;

  function draw(now) {
    ctx.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
    }
    for (let i = 0; i < parts.length; i++) {
      for (let j = i + 1; j < parts.length; j++) {
        const a = parts[i], b = parts[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > MAX_LINK) continue;
        ctx.strokeStyle = 'rgba(108,92,231,' + (1 - dist / MAX_LINK) * 0.16 + ')';
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    }
    for (const p of parts) {
      ctx.fillStyle = p.c + p.a + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

    derick: { name:"德里克", tags:["盗贼"], initial:"德", grad:NEW_GRADS[3],
      identity:"旧城区的快手", personality:"油滑机敏", speech_style:"压低声，随口溜",
      taboos:["背信出卖", "留名"], traits:[["灵巧",83],["野心",77],["谨慎",66]],
      state:"潜行中", place:"旧城区",
      relations:[ {who:"ailin", how:"竞争", score:"-10"}, {who:"kael", how:"敌对", score:"-60"}, {who:"liya", how:"背叛", score:"+30"} ] },
  };

  const svg = document.getElementById('edgeLayer');
  const canvasBox = document.querySelector('.canvas');
  const ns = "http://www.w3.org/2000/svg";
  let selected = "";

  function gradFor(key){
    let h = 0;
    for (const c of key) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return NEW_GRADS[h % NEW_GRADS.length];
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g,
      c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function dataOf(key){ return realNpcs[key] || DEMO[key] || null; }
  function displayName(d, key){ return d.name || key; }
  function relationsOf(d){
    if (Array.isArray(d.relations)) return d.relations;
    if (Array.isArray(d.rels)) return d.rels.map(r => ({who:r.who, how:r.how, score:r.score}));
    return null;
  }
  function relCls(score){
    const n = parseInt(String(score).replace(/[^\d-]/g, ""), 10);
    if (isNaN(n)) return "green";
    return n < 0 ? "red" : "green";
  }

  // ── 节点 ──
  function addNode(key, d) {
    const node = document.createElement("div");
    node.className = "node";
    node.dataset.npc = key;
    const spot = NEW_SPOTS[nodeCursor % NEW_SPOTS.length];
    nodeCursor++;
    node.style.left = spot[0] + "%";
    node.style.top = spot[1] + "%";
    const name = displayName(d, key);
    node.innerHTML =
      `<div class="avatar" style="background:${d.grad || gradFor(key)}">${escapeHtml(name[0])}</div>
       <div><div class="nm">${escapeHtml(name)}</div>
       <div class="rl">${escapeHtml((d.identity || "自定义").slice(0, 12))}</div></div>`;
    node.addEventListener("click", () => selectNpc(key));
    canvasBox.appendChild(node);
  }

  // ── 连线：只画 relations 里双端都在数据中的边 ──
  function centerOf(el) {
    return { x: el.offsetLeft + el.offsetWidth / 2, y: el.offsetTop + el.offsetHeight / 2 };
  }
  function layoutEdges() {
    svg.innerHTML = "";
    canvasBox.querySelectorAll(".edge-label").forEach(l => l.remove());
    const seen = new Set();
    for (const key of Object.keys(realNpcs).concat(Object.keys(DEMO))) {
      const rels = relationsOf(dataOf(key)) || [];
      for (const r of rels) {
        const pairId = [key, r.who].sort().join("|");
        if (seen.has(pairId)) continue;
        seen.add(pairId);
        const a = canvasBox.querySelector(`.node[data-npc="${key}"]`);
        const b = canvasBox.querySelector(`.node[data-npc="${r.who}"]`);
        if (!a || !b) continue;
        const pa = centerOf(a), pb = centerOf(b);
        const cls = relCls(r.score);
        const line = document.createElementNS(ns, "line");
        line.setAttribute("x1", pa.x); line.setAttribute("y1", pa.y);
        line.setAttribute("x2", pb.x); line.setAttribute("y2", pb.y);
        line.setAttribute("stroke", cls === "red" ? "#e74c3c"
                            : cls === "orange" ? "#f39c12" : "#27ae60");
        line.setAttribute("stroke-opacity", "0.55");
        line.setAttribute("stroke-width", "2");
        svg.appendChild(line);
        const lab = document.createElement("div");
        lab.className = "edge-label " + cls;
        lab.style.left = ((pa.x + pb.x) / 2) + "px";
        lab.style.top  = ((pa.y + pb.y) / 2) + "px";
        lab.innerHTML = escapeHtml(r.how + " " + r.score).replace(" ", "&nbsp;");
        canvasBox.appendChild(lab);
      }
    }
  }

  // ── 面板：区块 = JSON 字段存在性（字段删了区块整体消失） ──
  function sec(title, html){
    return html ? `<div><div class="sec-title">${title}</div>${html}</div>` : "";
  }
  function renderPanel(key) {
    const d = dataOf(key);
    if (!d) return;
    const name = displayName(d, key);
    document.getElementById("p-avatar").textContent = d.initial || name[0];
    document.getElementById("p-avatar").style.background = d.grad || gradFor(key);
    document.getElementById("p-name").textContent = name;
    document.getElementById("p-tags").innerHTML = (d.tags || [])
      .map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("");

    let blocks = "";

    // 状态区（state/place 演示兼容 + identity 任何数据都有就用）
    let status = "";
    if (d.state && d.place) {
      status += `<div class="row"><span class="dot"></span>${escapeHtml(d.state)}</div>
                 <div class="row"><span style="color:var(--dim);">位置</span>${escapeHtml(d.place)}</div>`;
    }
    if (d.identity) {
      status += `<div class="row"><span style="color:var(--dim);">身份</span>${escapeHtml(d.identity)}</div>`;
    }
    blocks += sec("当前状态", status ? `<div class="status-box">${status}</div>` : "");

    // 性格特征（traits 数值条 / personality / speech_style / taboos）
    let traits = "";
    if (d.traits) traits += d.traits.map(([k, v]) =>
      `<div class="trait"><div class="tl"><span>${escapeHtml(k)}</span><b>${v}</b></div>
       <div class="bar"><i style="width:${v}%"></i></div></div>`).join("");
    if (d.personality) traits += `<div class="trait"><div class="tl"><span>性格</span></div><p>${escapeHtml(d.personality)}</p></div>`;
    if (d.speech_style) traits += `<div class="trait"><div class="tl"><span>说话风格</span></div><p>${escapeHtml(d.speech_style)}</p></div>`;
    if (Array.isArray(d.taboos) && d.taboos.length) traits += `<div class="trait"><div class="tl"><span>禁忌</span></div><p>${escapeHtml(d.taboos.join("、"))}</p></div>`;
    blocks += sec("性格特征", traits);

    // 好感关系（relations 是 JSON 唯一真相 — 删了字段整块没有）
    const rels = relationsOf(d);
    let relsHtml = "";
    if (rels && rels.length) {
      relsHtml = rels.map(r => {
        const who = dataOf(r.who);
        const cls = relCls(r.score);
        const initial = who ? (who.initial || displayName(who, r.who)[0]) : "?";
        const grad = who ? (who.grad || gradFor(r.who)) : gradFor(r.who);
        return `<div class="rel-row">
          <div class="avatar" style="background:${grad}">${escapeHtml(initial)}</div>
          <span class="nm">${escapeHtml(r.who)}</span>
          <span class="sc ${cls}">${escapeHtml(r.how || "")}&nbsp;${escapeHtml(r.score || "")}</span>
        </div>`;
      }).join("");
    }
    blocks += sec("好感关系", relsHtml);

    // 欲望与目标
    let goals = "";
    if (d.desires && Object.keys(d.desires).length) {
      goals += Object.entries(d.desires).map(([k, v]) => {
        const pct = Math.round(Number(v) * 100) || 0;
        return `<div class="trait"><div class="tl"><span>欲望 · ${escapeHtml(k)}</span><b>${pct}%</b></div>
                <div class="bar"><i style="width:${pct}%"></i></div></div>`;
      }).join("");
    }
    if (d.goals && Object.keys(d.goals).length) {
      goals += Object.entries(d.goals).map(([k, g]) => {
        const t = (g && g.target) || 1;
        const done = (g && g.progress) || 0;
        const pct = Math.min(100, Math.round(done / t * 100));
        return `<div class="trait"><div class="tl"><span>目标 · ${escapeHtml(k)}</span><b>${pct}%</b></div>
                <div class="bar"><i style="width:${pct}%"></i></div></div>`;
      }).join("");
    }
    blocks += sec("欲望与目标", goals);

    // 规则话术（replies 每词条一行 + fallback）
    let rulesHtml = "";
    if (d.rules && d.rules.replies && Object.keys(d.rules.replies).length) {
      rulesHtml += Object.entries(d.rules.replies).map(([k, v]) =>
        `<div class="rel-row"><span class="nm">${escapeHtml(k)}</span>
         <span style="margin-left:auto;color:var(--dim);font-size:12.5px;max-width:200px;text-align:right;">${escapeHtml(v)}</span></div>`).join("");
    }
    if (d.rules && d.rules.fallback) {
      rulesHtml += `<div class="rel-row"><span class="nm" style="color:var(--dim);">兜底回话</span>
        <span style="margin-left:auto;color:var(--dim);font-size:12.5px;max-width:200px;text-align:right;">${escapeHtml(d.rules.fallback)}</span></div>`;
    }
    blocks += sec("规则话术", rulesHtml);

    document.getElementById("p-detail").innerHTML = blocks ||
      `<div class="detail-empty">这个人设还没有可展示的字段（详情跟随 JSON）。</div>`;
  }

  function selectNpc(key) {
    if (!dataOf(key)) return;
    selected = key;
    document.querySelectorAll(".node").forEach(n =>
      n.classList.toggle("selected", n.dataset.npc === key));
    renderPanel(key);
  }

  // ── 数据源: /api/personas 为真相; 失败/空 → 演示数据兜底 ──
  function loadPersonas() {
    fetch("/api/personas").then(r => r.json()).then(d => {
      const list = (d.personas || []).filter(p => p && p.id);
      if (!list.length) throw new Error("empty");
      document.querySelectorAll(".node").forEach(n => n.remove());
      for (const p of list) { realNpcs[p.id] = p; addNode(p.id, p); }
      selectNpc(list[0].id);
      layoutEdges();
    }).catch(() => {
      // 大脑未启动（演示模式）: 用内置数据渲染, 页面不白屏
      for (const key of Object.keys(DEMO)) addNode(key, DEMO[key]);
      selectNpc("ailin");
      layoutEdges();
    });
  }

  // ── 新建 NPC: 模态框开关 + 提交（POST /api/personas 同源, 8765 大脑服务器） ──
  const overlay = document.getElementById("npcOverlay");
  const errBox = document.getElementById("npcFormErr");
  function showErr(msg){ errBox.textContent = msg; errBox.classList.add("show"); }
  function clearErr(){ errBox.textContent = ""; errBox.classList.remove("show"); }
  function openDialog(){
    clearErr();
    overlay.classList.add("show");
    document.getElementById("f-id").focus();
  }
  function closeDialog(){ clearErr(); overlay.classList.remove("show"); }

  document.querySelector(".btn-new").addEventListener("click", openDialog);
  document.getElementById("btnCancel").addEventListener("click", closeDialog);
  overlay.addEventListener("click", e => { if (e.target === overlay) closeDialog(); });

  document.getElementById("btnSave").addEventListener("click", async () => {
    clearErr();
    const id = document.getElementById("f-id").value.trim();
    if (!id) return showErr("ID 不能为空");
    const body = {
      id,
      name: document.getElementById("f-name").value.trim(),
      identity: document.getElementById("f-identity").value.trim(),
      personality: document.getElementById("f-personality").value.trim(),
      speech_style: document.getElementById("f-speech").value.trim(),
      taboos: document.getElementById("f-taboos").value
        .split("\n").map(s => s.trim()).filter(Boolean),
    };
    const advRaw = document.getElementById("f-adv").value.trim();
    if (advRaw) {
      try { Object.assign(body, JSON.parse(advRaw)); }
      catch (e) { return showErr("高级字段不是合法 JSON：" + e.message); }
    }
    const btn = document.getElementById("btnSave");
    btn.disabled = true; btn.textContent = "保存中…";
    try {
      const r = await fetch("/api/personas", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) return showErr(data.detail || `保存失败（HTTP ${r.status}）`);
      // 演示模式下清掉演示数据, 转到真数据层
      if (!Object.keys(realNpcs).length) {
        document.querySelectorAll(".node").forEach(n => n.remove());
        for (const k of Object.keys(DEMO)) delete DEMO[k];
      }
      realNpcs[id] = body;
      addNode(id, body);
      selectNpc(id);
      layoutEdges();
      closeDialog();
    } catch (e) {
      showErr("连不上大脑服务器（127.0.0.1:8765）——先启动大脑，再保存");
    } finally {
      btn.disabled = false; btn.textContent = "保存人设";
    }
  });

  window.addEventListener("resize", layoutEdges);
  loadPersonas();
})();
</script>

</body>
</html>
