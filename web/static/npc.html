<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPCSidekick</title>
<style>
  :root{
    --bg-1:#ffffff;
    --bg-2:#f4f1f8;
    --accent:#e08a1e;
    --accent-soft:#9c5a12;
    --accent-dim:rgba(224,138,30,0.22);
    --card:#ffffff;
    --card-border:rgba(224,138,30,0.30);
    --text:#1f1a24;
    --text-dim:#6b6470;
    --green:#2f7d49;
    --green-soft:#3f8f57;
    --danger:#c0392b;
    --radius:16px;
    --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font);
    color:var(--text);
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(224,138,30,0.10), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(120,80,200,0.06), transparent 60%),
      linear-gradient(135deg, #ffffff, #f4f1f8);
    background-attachment:fixed;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ---------- 标题栏 ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;
    border-bottom:1px solid var(--card-border);
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(10px);
    flex:0 0 auto;
  }
  .brand{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700;letter-spacing:.5px;}
  .mode-btn{flex:0 0 auto;background:transparent;border:1px solid var(--card-border);color:var(--accent-soft);font-weight:600;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px;font-family:var(--font);}
  .mode-btn:hover{background:var(--accent-dim);}
  .mode-btn.llm{color:#2f7d49;border-color:rgba(47,125,73,0.4);}
  .npc-select{flex:0 0 auto;background:#f6f3fa;border:1px solid var(--card-border);border-radius:10px;padding:6px 10px;font-size:13px;font-family:var(--font);color:var(--text);outline:none;}
  /* ---------- 主布局 ---------- */
  .main{
    flex:1 1 auto;min-height:0;
    display:grid;
    grid-template-columns:300px 1fr 330px;
    gap:18px;padding:16px;
  }
  .col{display:flex;flex-direction:column;gap:18px;min-height:0;min-width:0;overflow-y:auto;padding-right:4px;}
  .col::-webkit-scrollbar{width:8px;}
  .col::-webkit-scrollbar-thumb{background:rgba(246,161,61,0.2);border-radius:8px;}
  .col-mid{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;}

  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    padding:12px;
  }
  .card h3{
    font-size:14px;color:var(--accent-soft);margin-bottom:12px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;letter-spacing:.5px;
  }
  .card h3 .hint{font-size:11px;color:var(--text-dim);font-weight:400;font-family:var(--mono);}

  /* ---------- 左栏：NPC 名片 ---------- */
  .npc{display:flex;gap:14px;align-items:center;margin-bottom:14px;}
  .npc .avatar{border-radius:50%;box-shadow:0 0 18px rgba(246,161,61,0.25);flex:0 0 auto;}
  .npc .name{font-size:20px;font-weight:700;}
  .npc .role{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .kv{display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.5;}
  .kv .row{display:flex;gap:8px;}
  .kv .k{color:var(--accent-soft);flex:0 0 48px;font-weight:600;}
  .kv .v{color:var(--text);flex:1;}
  .taboo .v{color:var(--danger);}

  /* ---------- 左栏：世界状态 ---------- */
  .state-grid{display:flex;flex-direction:column;gap:12px;}
  .state-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;}
  .state-row .label{color:var(--text-dim);}
  .state-row .val{color:var(--accent-soft);font-weight:600;}
  .bag{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
  .bag .item{flex:1;min-width:70px;background:rgba(224,138,30,0.06);border:1px solid var(--card-border);border-radius:12px;padding:10px;text-align:center;}
  .bag .item .num{font-size:20px;font-weight:700;color:var(--accent-soft);}
  .bag .item .lab{font-size:11px;color:var(--text-dim);margin-top:2px;}

  /* ---------- 中栏：对话 ---------- */
  .chat-card{flex:1;display:flex;flex-direction:column;min-height:0;}
  .stream{flex:1 1 auto;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:4px;}
  .stream::-webkit-scrollbar{width:8px;}
  .stream::-webkit-scrollbar-thumb{background:rgba(246,161,61,0.2);border-radius:8px;}
  .msg{display:flex;gap:10px;max-width:82%;align-items:flex-end;}
  .msg.player{align-self:flex-end;flex-direction:row-reverse;}
  .msg.npc{align-self:flex-start;}
  .bubble{padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.55;word-break:break-word;}
  .msg.player .bubble{background:linear-gradient(135deg,#2f6b40,#3f8f57);color:#eafff0;border-bottom-right-radius:4px;}
  .msg.npc .bubble{background:linear-gradient(135deg,rgba(246,161,61,0.16),rgba(246,161,61,0.08));border:1px solid var(--card-border);color:var(--text);border-bottom-left-radius:4px;}
  .mini-avatar{width:36px;height:36px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 10px rgba(246,161,61,0.2);}
  .system-msg{align-self:center;text-align:center;font-size:12.5px;color:var(--text-dim);font-style:italic;background:rgba(20,15,40,0.04);padding:8px 14px;border-radius:999px;border:1px dashed var(--card-border);max-width:90%;}
  .thinking .bubble{color:var(--accent-soft);}
  .thinking .dots::after{content:"";animation:blink 1.2s infinite steps(4,end);}
  @keyframes blink{0%{content:"";}25%{content:".";}50%{content:"..";}75%{content:"...";}}

  .composer{flex:0 0 auto;display:flex;gap:10px;padding-top:12px;}
  .composer input{flex:1;background:#f6f3fa;border:1px solid var(--card-border);border-radius:12px;padding:12px 14px;color:var(--text);font-size:14px;font-family:var(--font);outline:none;}
  .composer input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(246,161,61,0.12);}
  .composer input::placeholder{color:var(--text-dim);}
  .composer button{background:linear-gradient(135deg,var(--accent),#ffce8a);color:#1a1030;font-weight:700;border:none;border-radius:12px;padding:0 20px;cursor:pointer;font-size:14px;font-family:var(--font);}
  .composer button:hover{filter:brightness(1.08);}

  /* ---------- 右栏：记忆（可编辑） ---------- */
  .mem-item{background:rgba(224,138,30,0.05);border:1px solid var(--card-border);border-radius:12px;padding:10px 12px;margin-bottom:10px;}
  .mem-time{font-size:11px;color:var(--text-dim);font-family:var(--mono);margin-bottom:4px;}
  .mem-content{font-size:13px;line-height:1.5;color:var(--text);outline:none;border-radius:6px;padding:2px 4px;cursor:text;}
  .mem-content:focus{background:rgba(246,161,61,0.08);box-shadow:0 0 0 1px var(--accent-dim);}
  .mem-imp{font-size:10px;color:var(--accent-soft);margin-top:6px;opacity:.8;}
  .add-btn{margin-top:4px;width:100%;background:rgba(246,161,61,0.08);border:1px dashed var(--accent-dim);color:var(--accent-soft);border-radius:10px;padding:8px;cursor:pointer;font-size:12px;font-family:var(--font);}
  .add-btn:hover{background:rgba(246,161,61,0.14);}

  /* ---------- 右栏：任务日志 ---------- */
  .task{margin-bottom:14px;}
  .task-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
  .step{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.5;padding:4px 0;color:var(--text);}
  .step .mark{flex:0 0 18px;text-align:center;font-weight:700;}
  .step.done .mark{color:var(--green-soft);}
  .step.fail .mark{color:var(--danger);}

  /* ---------- 响应式：窄屏折叠 ---------- */
  @media (max-width:1080px){
    body{overflow:auto;}
    .main{display:flex;flex-direction:column;flex:0 0 auto;height:auto;padding:12px;}
    .col{overflow:visible;}
    .col-mid{order:0;overflow:visible;}
    .col-left{order:1;}
    .col-right{order:2;}
    .chat-card{min-height:60vh;}
    .stream{max-height:none;}
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">NPCSidekick</div>
    <select id="npcSelect" class="npc-select" title="切换 NPC（共享同一个世界）"></select>
    <button id="modeBtn" class="mode-btn" title="切换对话模式：规则模式无需 API key，LLM 模式用小模型生成">模式: <b id="modeLabel">—</b></button>
  </div>

  <div class="main">

    <!-- 左栏 -->
    <div class="col col-left">
      <div class="card">
        <div class="npc">
          <div id="npc-avatar"></div>
          <div>
            <div class="name" id="npc-name">—</div>
            <div class="role" id="npc-role">—</div>
          </div>
        </div>
        <div class="kv">
          <div class="row"><span class="k">性格</span><span class="v" id="npc-personality">—</span></div>
          <div class="row"><span class="k">说话</span><span class="v" id="npc-speech">—</span></div>
          <div class="row taboo"><span class="k">禁忌</span><span class="v" id="npc-taboos">—</span></div>
        </div>
      </div>

      <div class="card">
        <h3>世界状态</h3>
        <div class="state-grid">
          <div class="state-row"><span class="label">当前位置</span><span class="val" id="pos">村庄</span></div>
          <div>
            <div class="label" style="color:var(--text-dim);font-size:12px;margin-bottom:6px;">背包</div>
            <div class="bag">
              <div class="item"><div class="num" id="inv-wood">5</div><div class="lab">木材</div></div>
              <div class="item"><div class="num" id="inv-stone">0</div><div class="lab">石头</div></div>
              <div class="item"><div class="num" id="inv-tool">0</div><div class="lab">工具</div></div>
            </div>
          </div>
          <div class="state-row"><span class="label">已交付主角</span><span class="val"><b id="del-wood">5</b> 木材</span></div>
        </div>
      </div>
    </div>

    <!-- 中栏 -->
    <div class="col col-mid">
      <div class="card chat-card">
        <h3>对话 <span class="hint">NPCSidekick</span></h3>
        <div class="stream" id="stream"></div>
        <div class="composer">
          <input id="input" placeholder="说点什么…（回车发送）" autocomplete="off">
          <button id="send">发送</button>
        </div>
      </div>
    </div>

    <!-- 右栏 -->
    <div class="col col-right">
      <div class="card">
        <h3>记忆 <span class="hint">记忆=可编辑文档</span></h3>
        <div id="memory"></div>
        <button class="add-btn" id="addMem">+ 新记忆</button>
      </div>
      <div class="card">
        <h3>任务日志</h3>
        <div id="tasks"></div>
      </div>
    </div>

  </div>

<script>
(function(){
  "use strict";
  const $ = (s,el)=> (el||document).querySelector(s);

  /* ===== 配置：mock / 真实后端切换 ===== */
  const USE_MOCK = true;       // 接真实后端时改为 false
  const API_BASE = "";         // 真实接口前缀，例如 "/api"

  /* ===== NPC 人设（示例: 苍 — 制作者改成自己的角色即可） ===== */
  const NPC_INFO = {
    id: "cang",
    name: "苍",
    role: "部落的老猎手，火塘边的话事人，见过冰河那边的大兽热爱合作",
    personality: "寡言直接，经验老到，话里都是日子熬出来的道理",
    speech: "短句，不废话，带点长辈的训诫味",
    taboos: "追跑得快的猎物、烧湿柴、入冬前不备兽皮、没把握就进冰河",
    intro: "你走进了苍所在的部落营地。"
  };

  /* ===== 预设回复（mock 模式用，苍口吻） ===== */
  const PRESET_REPLIES = [
    "别追跑得快的，追跑不动的。老骨头的话，错不了。",
    "柴火要挑干透的，湿柴烧起来全是烟。",
    "那只小狼崽……喂熟了就是家人。野兽和人，差的就是一口饭的情分。",
    "天冷下来之前，把兽皮晾够。冬天不认人，只认准备。",
    "冰河那边有长毛的大兽，比山还高。我年轻时远远见过一回。",
    "嗯，火塘边坐着说。"
  ];

  /* ===== Mock 数据 ===== */
  const mockState = { position:"村庄", inventory:{木材:5}, delivered:{木材:5} };
  const mockMemory = [
    { id:"m1", time:"今天 08:30", content:"完成: 采集 5 个木材交给主角", importance:8 },
    { id:"m2", time:"今天 10:05", content:"主角说今天天气好，适合干活。", importance:4 }
  ];
  const mockTasks = [
    { title:"采集木材交给主角", steps:[
      {text:"前往森林", done:true},
      {text:"采集 5 个木材", done:true},
      {text:"送回村庄交付", done:true}
    ]}
  ];

  const wait = (ms)=> new Promise(r=> setTimeout(r, ms));
  let mockMode = "rules";   // mock 模式的本地开关（接真实后端后由 /api/mode 管）

  /* ===== 数据接口契约（mock / 真实统一封装） ===== */
  const api = {
    async getState(){
      if(USE_MOCK){ await wait(120); return mockState; }
      const r = await fetch(API_BASE + "/api/state"); return r.json();
    },
    async getMemory(npcId){
      if(USE_MOCK){ await wait(120); return { entries: mockMemory }; }
      const r = await fetch(API_BASE + "/api/memory?npc_id=" + npcId); return r.json();
    },
    async getNpc(npcId){
      if(USE_MOCK){ return NPC_INFO; }
      const r = await fetch(API_BASE + "/api/npc?npc_id=" + npcId); return r.json();
    },
    async getNpcs(){
      if(USE_MOCK){ return { npcs: [{id:"cang",name:"苍"},{id:"ali",name:"阿黎"}] }; }
      const r = await fetch(API_BASE + "/api/npcs"); return r.json();
    },
    async talk(message, npcId){
      if(USE_MOCK){
        await wait(900); // 模拟思考延迟
        const reply = PRESET_REPLIES[Math.floor(Math.random()*PRESET_REPLIES.length)];
        return { reply };
      }
      const r = await fetch(API_BASE + "/api/talk", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ message, npc_id: npcId || currentNpc })
      });
      return r.json();
    },
    async submitTask(resource, count, npcId){
      if(USE_MOCK){ await wait(300); return { ok:true, steps: mockTasks[0].steps }; }
      const r = await fetch(API_BASE + "/api/task", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ resource, count, npc_id: npcId || currentNpc })
      });
      return r.json();
    },
    async getMode(){
      if(USE_MOCK){ return { mode: mockMode }; }
      const r = await fetch(API_BASE + "/api/mode"); return r.json();
    },
    async setMode(mode){
      if(USE_MOCK){ mockMode = mode; return { mode: mockMode }; }
      const r = await fetch(API_BASE + "/api/mode", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ mode })
      });
      return r.json();
    }
  };

  /* ===== 工具 ===== */
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function nowStr(){
    const d = new Date(); const p = n=> String(n).padStart(2,"0");
    return `今天 ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  /* ===== 渲染：世界状态 ===== */
  let currentNpc = "cang";   // 当前选中 NPC（多 NPC 切换）
  function renderState(s){
    // 兼容 mock（position/inventory 顶层）与真实后端（actors 多 NPC）
    const actor = s.actors ? (s.actors[currentNpc] || {}) : s;
    $("#pos").textContent = actor.position || s.position || "—";
    const inv = actor.inventory || s.inventory || {};
    $("#inv-wood").textContent  = inv["木材"]  ?? 0;
    $("#inv-stone").textContent = inv["石头"] ?? 0;
    $("#inv-tool").textContent  = inv["工具"]  ?? 0;
    const del = s.delivered || {};
    $("#del-wood").textContent  = del["木材"] ?? 0;
  }

  /* ===== 渲染：记忆（可编辑） ===== */
  let memoryData = [];
  function renderMemory(){
    const box = $("#memory");
    box.innerHTML = "";
    memoryData.forEach((m,i)=>{
      const el = document.createElement("div");
      el.className = "mem-item";
      el.innerHTML =
        '<div class="mem-time">'+ escapeHtml(m.time) +'</div>'+
        '<div class="mem-content" contenteditable="true" data-i="'+ i +'">'+ escapeHtml(m.content) +'</div>'+
        '<div class="mem-imp">重要度 '+ (m.importance!=null?m.importance:5) +'</div>';
      box.appendChild(el);
    });
    box.querySelectorAll(".mem-content").forEach(node=>{
      node.addEventListener("blur", ()=>{
        const i = +node.dataset.i;
        if(memoryData[i]) memoryData[i].content = node.textContent.trim();
      });
    });
  }
  $("#addMem").addEventListener("click", ()=>{
    memoryData.push({ id:"m"+Date.now(), time:nowStr(), content:"（新记忆，点此编辑）", importance:5 });
    renderMemory();
    const items = $("#memory").querySelectorAll(".mem-content");
    const last = items[items.length-1];
    if(last){ last.focus(); const sel=window.getSelection(); sel.removeAllRanges(); const r=document.createRange(); r.selectNodeContents(last); sel.addRange(r); }
  });

  /* ===== 渲染：任务日志 ===== */
  function renderTasks(tasks){
    const box = $("#tasks");
    box.innerHTML = "";
    tasks.forEach(t=>{
      const el = document.createElement("div");
      el.className = "task";
      let html = '<div class="task-title">'+ escapeHtml(t.title) +'</div>';
      t.steps.forEach(s=>{
        html += '<div class="step '+(s.done?"done":"fail")+'"><span class="mark">'+(s.done?"✓":"✗")+'</span><span class="txt">'+ escapeHtml(s.text) +'</span></div>';
      });
      el.innerHTML = html;
      box.appendChild(el);
    });
  }

  /* ===== 聊天 ===== */
  const AVATAR_INNER =
    '<circle cx="32" cy="32" r="31" fill="#1f1538"/>'+
    '<ellipse cx="32" cy="26" rx="22" ry="6" fill="#caa24a"/>'+
    '<path d="M20 26 Q32 8 44 26 Z" fill="#b5893a"/>'+
    '<circle cx="32" cy="40" r="13" fill="#e8b487"/>'+
    '<circle cx="27" cy="39" r="1.8" fill="#3a2418"/>'+
    '<circle cx="37" cy="39" r="1.8" fill="#3a2418"/>'+
    '<circle cx="24" cy="43" r="2" fill="#f0a0a0" opacity="0.5"/>'+
    '<circle cx="40" cy="43" r="2" fill="#f0a0a0" opacity="0.5"/>'+
    '<path d="M27 45 Q32 49 37 45" stroke="#7a4a2a" stroke-width="1.6" fill="none" stroke-linecap="round"/>';

  const stream = $("#stream");
  function scrollDown(){ stream.scrollTop = stream.scrollHeight; }
  function addSystem(text){
    const d = document.createElement("div");
    d.className = "system-msg"; d.textContent = text;
    stream.appendChild(d); scrollDown();
  }
  function addPlayer(text){
    const d = document.createElement("div");
    d.className = "msg player";
    d.innerHTML = '<div class="bubble">'+ escapeHtml(text) +'</div>';
    stream.appendChild(d); scrollDown();
  }
  function addNpcThinking(){
    const d = document.createElement("div");
    d.className = "msg npc thinking";
    d.innerHTML =
      '<svg class="mini-avatar" viewBox="0 0 64 64">'+ AVATAR_INNER +'</svg>'+
      '<div class="bubble">'+ NPC_INFO.name +'正在想<span class="dots"></span></div>';
    stream.appendChild(d); scrollDown();
    return d;
  }
  function setNpcReply(el, text){
    el.classList.remove("thinking");
    el.querySelector(".bubble").textContent = text;
    scrollDown();
  }

  async function send(){
    const input = $("#input");
    const text = input.value.trim();
    if(!text) return;
    input.value = "";
    addPlayer(text);
    const thinking = addNpcThinking();
    try{
      const res = await api.talk(text, currentNpc);
      setNpcReply(thinking, (res && res.reply) ? res.reply : "（"+ NPC_INFO.name +"没吭声…）");
    }catch(e){
      setNpcReply(thinking, "（连接出了点问题，稍后再试）");
    }
  }
  $("#send").addEventListener("click", send);
  $("#input").addEventListener("keydown", e=>{ if(e.key==="Enter") send(); });

  /* ===== 模式开关（规则 ↔ LLM，演示用） ===== */
  function renderMode(m){
    const btn = $("#modeBtn");
    if(!m) return;
    const label = m.mode === "llm" ? "LLM" : "规则";
    $("#modeLabel").textContent = label;
    btn.classList.toggle("llm", m.mode === "llm");
  }
  $("#modeBtn").addEventListener("click", async ()=>{
    const cur = $("#modeLabel").textContent === "LLM" ? "llm" : "rules";
    const next = cur === "llm" ? "rules" : "llm";
    const r = await api.setMode(next);
    renderMode(r);
  });

  /* ===== NPC 切换（多 NPC 共享世界） ===== */
  function renderNpcCard(npc){
    if(npc && npc.name){
      Object.assign(NPC_INFO, npc);
      $("#npc-name").textContent = npc.name;
      $("#npc-role").textContent = npc.role || "";
      $("#npc-personality").textContent = npc.personality || "";
      $("#npc-speech").textContent = npc.speech || "";
      $("#npc-taboos").textContent = npc.taboos || "";
      $("#npc-avatar").innerHTML = '<svg class="avatar" viewBox="0 0 64 64" width="64" height="64">'+ AVATAR_INNER +'</svg>';
      $("#input").placeholder = "对" + npc.name + "说点什么…（回车发送）";
    }
  }
  async function switchNpc(npcId){
    if(!npcId) return;
    currentNpc = npcId;
    addSystem("你走到了 " + NPC_INFO.name + " 身边。");
    try{
      const npc = await api.getNpc(npcId); renderNpcCard(npc);
      const s = await api.getState(); renderState(s);
      const mem = await api.getMemory(npcId); memoryData = (mem && mem.entries) || []; renderMemory();
    }catch(e){ console.warn("切换 NPC 失败：", e); }
  }

  /* ===== 初始化 ===== */
  async function init(){
    try{
      const npcs = await api.getNpcs();          // NPC 列表 → 下拉
      const sel = $("#npcSelect");
      (npcs.npcs || []).forEach(n => {
        const opt = document.createElement("option");
        opt.value = n.id; opt.textContent = n.name;
        sel.appendChild(opt);
      });
      sel.addEventListener("change", e => switchNpc(e.target.value));
      const npc = await api.getNpc(sel.value || "cang"); renderNpcCard(npc);
    }catch(e){ console.warn("读取 NPC 列表失败，使用默认示例：", e); }
    addSystem(NPC_INFO.intro);
    try{
      const s = await api.getState(); renderState(s);
      const mem = await api.getMemory(currentNpc); memoryData = (mem && mem.entries) || []; renderMemory();
      renderTasks(mockTasks);
      const m = await api.getMode(); renderMode(m);
    }catch(e){ console.warn("初始化部分数据失败：", e); }
  }
  init();
})();
</script>
</body>
</html>
